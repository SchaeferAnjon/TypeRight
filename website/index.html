<style>:root{
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei UI",sans-serif;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --bg:#FAFAFB;--side:#F1F1F3;--card:#FFFFFF;--pop:#FFFFFF;
  --text:#18191C;--text2:#5F636C;--text3:#9A9EA6;
  --line:rgba(0,0,0,.09);--line2:rgba(0,0,0,.16);
  --fill:rgba(0,0,0,.04);--sel:rgba(0,0,0,.07);
  --fix:#13804B;--fix-soft:rgba(19,128,75,.11);--fix-line:rgba(19,128,75,.38);
  --mark:#C98A12;--mark-soft:rgba(232,170,40,.17);
  --me:#E7EDF5;--ink:#18191C;--on-ink:#FFFFFF;
  --sh-pop:0 0 0 .5px rgba(0,0,0,.13),0 10px 30px rgba(0,0,0,.13),0 2px 6px rgba(0,0,0,.06);
  --sh-win:0 0 0 .5px rgba(0,0,0,.14),0 24px 60px rgba(0,0,0,.14),0 4px 14px rgba(0,0,0,.06);
  --wall:linear-gradient(135deg,#DCE6E0 0%,#E9E7DF 48%,#DEDFE8 100%);
  --wrap:1160px;
}
:root[data-theme="dark"]{
  --bg:#141518;--side:#1A1B1E;--card:#1F2024;--pop:#2A2B30;
  --text:#EDEDEF;--text2:#9095A0;--text3:#5F6470;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.15);
  --fill:rgba(255,255,255,.05);--sel:rgba(255,255,255,.09);
  --fix:#52C690;--fix-soft:rgba(82,198,144,.15);--fix-line:rgba(82,198,144,.45);
  --mark:#E2A84A;--mark-soft:rgba(226,168,74,.18);
  --me:#2B3340;--ink:#EDEDEF;--on-ink:#141518;
  --sh-pop:0 0 0 .5px rgba(255,255,255,.12),0 12px 34px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.3);
  --sh-win:0 0 0 .5px rgba(255,255,255,.1),0 24px 60px rgba(0,0,0,.5),0 4px 14px rgba(0,0,0,.3);
  --wall:linear-gradient(135deg,#1C2724 0%,#25241F 50%,#20212A 100%);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;text-autospace:normal;font-kerning:normal;letter-spacing:0}
a{color:inherit;text-decoration:none;cursor:pointer}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}
.center{text-align:center}
.muted{color:var(--text2)}
/* nav */
.snav{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(16px);border-bottom:.5px solid transparent}
.snav.sc{border-bottom-color:var(--line)}
.snav .in{height:64px;display:flex;align-items:center;gap:28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px}
.brand svg{width:28px;height:28px}
.snav .links{display:flex;gap:22px;font-size:14px;color:var(--text2)}
.snav .links a:hover,.snav .links a.on{color:var(--text)}
.snav .nr{margin-left:auto;display:flex;align-items:center;gap:16px;font-size:14px}
.lmenu{position:relative}
.lbtn{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:6px;color:var(--text2)}
.lbtn:hover{background:var(--fill);color:var(--text)}
.lpop{position:absolute;right:0;top:38px;width:220px;background:var(--pop);border-radius:12px;box-shadow:var(--sh-pop);padding:6px;display:none;z-index:60}
.lpop.on{display:block}
.lpop button{display:flex;width:100%;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:6px;font-size:14px;text-align:left}
.lpop button:hover{background:var(--sel)}
.lpop button .ck{margin-left:auto;color:var(--fix)}
.lpop button small{margin-left:auto;font-size:12px;color:var(--text3)}
.lpop .lh{font-size:12px;color:var(--text3);padding:6px 10px 4px}
.gh{display:flex;align-items:center;gap:6px;color:var(--text2)}
.gh:hover{color:var(--text)}
/* buttons */
.sbtn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;border:.5px solid var(--line2);background:var(--card);font-size:15px;font-weight:500;white-space:nowrap}
.sbtn:hover{background:var(--fill)}
.sbtn.ink{background:var(--ink);color:var(--on-ink);border-color:transparent}
.sbtn.ink:hover{opacity:.88}
.sbtn.sm{height:34px;padding:0 14px;font-size:14px}
.sbtn.lg{height:54px;padding:0 28px;font-size:16px}
.sbtn.lg svg.i{width:18px;height:18px}
.tlink{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line2)}
.tlink:hover{text-decoration-color:var(--text)}
/* keycaps */
.kc{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 5px;border-radius:5px;border:.5px solid var(--line2);background:var(--fill);font-size:11px;font-weight:500;color:var(--text2);line-height:1;font-family:var(--sans)}
/* popup card (same as the app, DESIGN.md) */
.pa-card{position:absolute;z-index:20;background:var(--pop);border-radius:12px;box-shadow:var(--sh-pop);padding:10px 12px 9px;min-width:200px;max-width:470px;animation:paIn .16s ease-out;text-align:left;line-height:1.5;font-size:13px}
@keyframes paIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.pa-card.above{animation-name:paUp}
@keyframes paUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.pa-card::before{content:"";position:absolute;left:var(--nx,22px);top:-5px;width:10px;height:10px;background:var(--pop);transform:rotate(45deg);box-shadow:-.5px -.5px 0 rgba(0,0,0,.08);border-radius:2px 0 0 0}
.pa-card.above::before{top:auto;bottom:-5px;box-shadow:.5px .5px 0 rgba(0,0,0,.08);border-radius:0 0 2px 0}
.pa-card.static{position:relative;animation:none;display:inline-block}
.pa-card.out{opacity:0;transform:translateY(6px);transition:.22s}
.pa-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pa-was{font-size:14px;color:var(--text3);text-decoration:line-through;text-decoration-thickness:1px}
.pa-from{font-size:14px;color:var(--text2)}
.pa-arr{color:var(--text3);display:flex}
.pa-new{font-size:18px;font-weight:600;color:var(--fix);line-height:1.3}
.pa-ipa{font-size:13px;color:var(--text2)}
.spk{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--text2)}
.pa-tip{font-size:12px;color:var(--text2);margin-top:4px;max-width:420px}
.pa-foot{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text3);margin-top:7px;white-space:nowrap}
.pa-foot .kc{height:18px;min-width:20px}
.pa-foot .sp{margin-left:auto;padding-left:16px}
.pa-kind{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:6px}
.pa-kind .r{margin-left:auto;font-weight:400;color:var(--text3)}
.pa-sent{font-size:15px;line-height:1.6;color:var(--text)}
del.was{color:var(--text3);text-decoration:line-through;text-decoration-thickness:1px;font-size:13px;margin-right:2px}
ins.now{text-decoration:none;color:var(--fix);background:var(--fix-soft);border-radius:3px;padding:0 2px;font-weight:600}
.pa-why{font-size:13px;color:var(--text);margin-top:6px;padding-top:7px;border-top:.5px solid var(--line)}
.pa-pill{position:absolute;z-index:19;display:flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 8px;border-radius:999px;background:var(--pop);box-shadow:var(--sh-pop);font-size:12px;color:var(--text2);white-space:nowrap;animation:paUp .14s ease-out}
.pa-pill.ok{color:var(--fix)}
.spin{display:inline-flex;gap:3px}
.spin i{width:4px;height:4px;border-radius:999px;background:currentColor;opacity:.3;animation:sp 1s infinite}
.spin i:nth-child(2){animation-delay:.15s}.spin i:nth-child(3){animation-delay:.3s}
@keyframes sp{50%{opacity:1}}
/* marks in the typed text */
.m-src{background:var(--mark-soft);border-bottom:1.5px dotted var(--mark);border-radius:2px}
.m-ime{border-bottom:1.5px solid var(--text2)}
.m-just{animation:just 1.4s ease-out;border-radius:3px}
@keyframes just{0%{background:var(--fix-soft);color:var(--fix)}100%{background:transparent}}
.caret{display:inline-block;width:1.5px;height:1.15em;background:var(--text);vertical-align:-0.18em;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
/* fake app window used by demos */
.win{position:relative;background:var(--card);border-radius:12px;box-shadow:var(--sh-win);overflow:hidden;text-align:left;display:flex;flex-direction:column}
.win .tb{height:40px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:.5px solid var(--line);font-size:13px;color:var(--text2);flex:none}
.win .tb i{width:12px;height:12px;border-radius:999px;background:var(--line2);display:block}
.win .tb i:nth-child(1){background:#FF5F57}.win .tb i:nth-child(2){background:#FEBC2E}.win .tb i:nth-child(3){background:#28C840}
.win .tb .tt{margin-left:8px;color:var(--text)}
.win .tb .ts{color:var(--text3)}
.win .msgs{flex:1;padding:16px 20px;display:flex;flex-direction:column;gap:8px;justify-content:flex-end;min-height:0;overflow:hidden}
.bub{max-width:70%;padding:7px 12px;border-radius:14px;background:var(--fill);font-size:14px;line-height:1.45;align-self:flex-start}
.bub.me{align-self:flex-end;background:var(--me)}
.bub.new{animation:paUp .25s ease-out}
.composer{margin:0 14px 14px;border:.5px solid var(--line2);border-radius:12px;background:var(--card);padding:10px 14px;display:flex;gap:10px;align-items:flex-end;flex:none}
.field{flex:1;min-height:24px;font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word;outline:none}
.field .phd{color:var(--text3)}
.keyflash{position:absolute;left:50%;top:54px;transform:translateX(-50%) translateY(6px);background:rgba(20,21,24,.86);color:#fff;font-size:15px;font-weight:500;padding:8px 14px;border-radius:10px;display:flex;align-items:center;gap:8px;opacity:0;transition:.2s;z-index:30;white-space:nowrap}
.keyflash .kc{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff;height:22px;font-size:12px}
.keyflash.on{opacity:1;transform:translateX(-50%)}
/* doc pages */
.doc{display:grid;grid-template-columns:200px minmax(0,1fr);gap:64px;padding:48px 24px 96px}
.doc .toc{position:sticky;top:96px;align-self:start;display:flex;flex-direction:column;gap:2px;font-size:13px}
.doc .toc a{color:var(--text2);padding:5px 10px;border-radius:6px}
.doc .toc a:hover{color:var(--text);background:var(--fill)}
.doc article{max-width:780px}
.doc .kicker{font-size:13px;color:var(--text2)}
.doc h1{font-size:36px;line-height:1.3;margin:8px 0 12px;font-weight:600}
.doc h2{font-size:22px;line-height:1.35;margin:52px 0 12px;font-weight:600}
.doc p{margin:0 0 12px;color:var(--text)}
.doc p.muted{color:var(--text2)}
.ptable{width:100%;border-collapse:collapse;font-size:14px;margin:12px 0}
.ptable th{text-align:left;font-weight:500;color:var(--text2);font-size:13px;padding:8px 12px;border-bottom:.5px solid var(--line)}
.ptable td{padding:10px 12px;border-bottom:.5px solid var(--line);vertical-align:middle}
.ptable .pv{display:flex;align-items:center;gap:10px;font-weight:500}
.ptable .pv i{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:600;color:#fff}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:5px;font-size:12px;background:var(--fill);color:var(--text2);white-space:nowrap}
.tag.fix{background:var(--fix-soft);color:var(--fix)}
.gsteps{list-style:none;padding:0;margin:16px 0;counter-reset:g}
.gsteps>li{counter-increment:g;display:grid;grid-template-columns:28px 1fr;gap:14px;margin:0 0 22px}
.gsteps>li::before{content:counter(g);width:26px;height:26px;border-radius:999px;background:var(--ink);color:var(--on-ink);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:1px}
.gsteps b{font-weight:500}
.gsteps p{margin:4px 0 0}
.shotmock{margin-top:12px;border:.5px solid var(--line2);border-radius:10px;background:var(--card);overflow:hidden;font-size:13px}
.shotmock .bb{height:30px;display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--fill);color:var(--text3);font-size:12px;border-bottom:.5px solid var(--line)}
.shotmock .bb i{width:8px;height:8px;border-radius:999px;background:var(--line2)}
.shotmock .bd{padding:14px 16px;display:flex;align-items:center;gap:12px}
.shotmock .hl{outline:2px solid var(--fix);outline-offset:2px}
.keybox{font-family:var(--mono);font-size:12px;background:var(--fill);border-radius:6px;padding:6px 10px}
.callbox{background:var(--fill);border-radius:10px;padding:12px 16px;font-size:14px;margin:16px 0}
.callbox b{font-weight:500}
/* settings mock (app look, DESIGN.md) */
.setmock{display:grid;grid-template-columns:180px 1fr;border:.5px solid var(--line2);border-radius:12px;overflow:hidden;background:var(--card);margin-top:12px;font-size:13px;text-align:left}
.setmock .sd{background:var(--side);padding:12px 8px;border-right:.5px solid var(--line);display:flex;flex-direction:column;gap:2px}
.setmock .sd span{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:6px;color:var(--text2)}
.setmock .sd span.on{background:var(--sel);color:var(--text);font-weight:500}
.setmock .mn{padding:16px 18px}
.setmock .mn h5{margin:0 0 10px;font-size:15px;font-weight:600}
.setmock .pr{display:flex;align-items:center;gap:10px;height:40px;border-bottom:.5px solid var(--line);padding:0 4px}
.setmock .pr .rd{width:14px;height:14px;border-radius:999px;border:1.5px solid var(--line2)}
.setmock .pr.on .rd{border:4px solid var(--fix)}
.setmock .pr .d{color:var(--text3);font-size:12px}
.setmock .ex{padding:10px 4px 14px 28px;display:flex;gap:8px;align-items:center;border-bottom:.5px solid var(--line)}
.setmock .ex .keybox{flex:1}
.setmock .okl{color:var(--fix);font-size:12px;display:flex;align-items:center;gap:4px}
/* faq */
.faq{max-width:820px;margin:32px auto 0;text-align:left}
.faq details{border-bottom:.5px solid var(--line)}
.faq summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px 4px;font-size:15px;font-weight:500;cursor:pointer}
.faq summary::-webkit-details-marker{display:none}
.faq summary svg{margin-left:auto;color:var(--text3);transition:transform .2s}
.faq details[open] summary svg{transform:rotate(45deg)}
.faq details p{margin:0 4px 16px;color:var(--text2);font-size:14px;max-width:70ch}
/* footer */
.foot{border-top:.5px solid var(--line);padding:48px 0 32px;font-size:13px;color:var(--text2)}
.foot .cols{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:24px}
.foot h6{margin:0 0 10px;font-size:13px;font-weight:500;color:var(--text)}
.foot .cols a{display:block;padding:3px 0}
.foot .cols a:hover{color:var(--text)}
.foot .cols a.brand{display:inline-flex;color:var(--text)}
.foot .tagline{max-width:300px;margin-top:10px}
.foot .fam{display:flex;align-items:center;gap:10px;margin-top:36px;padding-top:20px;border-top:.5px solid var(--line)}
.foot .fam .by:hover{color:var(--text)}
.foot .fam .by u{text-underline-offset:3px;text-decoration-color:var(--line2)}
.foot .fam .icons{display:flex;align-items:center;gap:10px}
.foot .fam .icons a{position:relative;display:flex}
.foot .fam img{width:22px;height:22px;border-radius:5px}
.foot .fam .me img{outline:1.5px solid var(--fix);outline-offset:2px;border-radius:5px}
.foot .fam .xtip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:var(--on-ink);font-size:12px;padding:4px 8px;border-radius:6px;pointer-events:none;display:none}
.foot .fam .icons a:last-child .xtip{left:auto;right:0;transform:none}
.foot .fam .icons a:hover .xtip,.foot .fam .icons a:focus-visible .xtip{display:block}
.foot .flink{display:block;padding:3px 0;font-size:13px;color:inherit;text-align:left}
.foot .flink:hover{color:var(--text)}
.foot .bot{display:flex;justify-content:space-between;margin-top:20px;color:var(--text3);font-size:12px}
@media (max-width:820px){
  .snav .links,.snav .gh{display:none}
  .doc{grid-template-columns:minmax(0,1fr);gap:16px}.doc .toc{position:static;flex-direction:row;flex-wrap:wrap}
  .foot .cols{grid-template-columns:1fr 1fr}
}
/* direction B: same family frame, the popup card is the main character */
.kicker{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text2)}
.kicker .dot{width:7px;height:7px;border-radius:999px;background:var(--fix)}
.h2{font-weight:600;font-size:clamp(28px,3vw,40px);line-height:1.25;margin:10px 0 0}
.sec{padding:112px 0 0}
.lede{font-size:16px;color:var(--text2);margin:12px 0 0;max-width:60ch}
.bhero{padding:56px 0 0}
.bhero .grid{display:grid;grid-template-columns:420px minmax(0,1fr);gap:56px;align-items:center}
.bhero h1{font-size:56px;line-height:1.18;font-weight:600;margin:16px 0 0}
.bhero h1 .fx{color:var(--fix)}
.bhero .sub{font-size:17px;line-height:1.7;color:var(--text2);margin:20px 0 0}
.bhero .cta{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}
.bhero .meta{font-size:13px;color:var(--text2);margin-top:16px;line-height:1.8}
.bhero .meta b{color:var(--text);font-weight:500}
.play{position:relative}
.play .stagebg{position:absolute;inset:-28px -28px -20px -28px;background:var(--wall);border-radius:20px;z-index:0}
.play .demo{position:relative;z-index:1;height:470px}
.play .demo .win{height:100%}
.play .field{font-size:19px;line-height:1.6;min-height:62px}
.play .demo .pa-card{padding:13px 16px 11px;max-width:560px}
.play .demo .pa-new{font-size:24px}
.play .demo .pa-was,.play .demo .pa-from{font-size:17px}
.play .demo .pa-ipa{font-size:15px}
.play .demo .pa-tip{font-size:14px;max-width:500px}
.play .demo .pa-sent{font-size:18px}
.play .demo .pa-why{font-size:15px}
.play .demo .pa-foot{font-size:13px}
.play .demo .pa-kind{font-size:13px}
.play .demo .pa-pill{font-size:13px;height:28px;padding:0 11px}
.play.trying .composer{box-shadow:0 0 0 3px var(--fix-soft);border-color:var(--fix-line)}
.play .field[contenteditable="true"]{cursor:text}
.moments{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.moment{display:flex;align-items:center;gap:8px;background:var(--card);border:.5px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;color:var(--text2);transition:.2s}
.moment .n{width:20px;height:20px;border-radius:999px;border:.5px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:11px;flex:none}

function go(target,push=true){
  const [p,anchor]=target.split('#');const page=PAGES.includes(p)?p:'home';
  if(page===ST.page){if(anchor)scrollToId(anchor);else scrollTo({top:0,behavior:'smooth'});return}
  ST.page=page;
  if(push)history.pushState(null,'',hrefOf(page));
  render();
  if(anchor)setTimeout(()=>scrollToId(anchor),40);
}

document.addEventListener('click',e=>{
  if(e.target.closest('#lbtn')){toggleLang();return}
  const l=e.target.closest('[data-lang]');if(l){pickLang(l.dataset.lang);return}
  const g=e.target.closest('[data-go]');if(g&&!e.metaKey&&!e.ctrlKey&&!e.shiftKey){e.preventDefault();closeLang();closeSheet();go(g.dataset.go);return}
  const d=e.target.closest('[data-dl]');if(d){e.preventDefault();closeLang();download();return}
  if(!e.target.closest('.lmenu'))closeLang();
  if(!e.target.closest('.dlsheet'))closeSheet();
});

/* ---------- download: ask GitHub once for the newest release and use its .dmg ----------
   The release list (not /releases/latest) so a first alpha counts too and "no release yet" is a plain empty list.
   States: loading, ready (a .dmg to download), nodmg (a release without one), none (nothing released yet),
   unknown (GitHub did not answer: the sheet links to the releases page instead, like GetNewWord). */
const REL={state:'loading'};
(function(){
  const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),6000);
  fetch(`https://api.github.com/repos/${REPO}/releases?per_page=10`,{signal:ctl.signal,headers:{Accept:'application/vnd.github+json'}})
   .then(r=>{if(r.status===404)return [];if(!r.ok)throw new Error('GitHub answered '+r.status);return r.json()})
   .then(list=>{
     const pub=list.filter(x=>!x.draft),rel=pub.find(x=>!x.prerelease)||pub[0];
     if(!rel){REL.state='none';return}
     const dmgs=(rel.assets||[]).filter(a=>/\.dmg$/i.test(a.name)),dmg=dmgs.find(a=>/^TypeRight/i.test(a.name))||dmgs[0];
     Object.assign(REL,{state:dmg?'ready':'nodmg',tag:rel.tag_name,date:rel.published_at,page:rel.html_url,url:dmg&&dmg.browser_download_url,name:dmg&&dmg.name,mb:dmg&&Math.max(1,Math.round(dmg.size/1048576))});
   })
   .catch(err=>{REL.state='unknown';console.warn('Latest release not available:',err.message)})
   .finally(()=>{clearTimeout(timer);showVersion();if(sheetOpen())renderSheet()});
})();
function relDate(){if(!REL.date)return '';const d=new Date(REL.date);return ZH?t('{0} 月 {1} 日',d.getMonth()+1,d.getDate()):d.toLocaleDateString(LANG,{day:'numeric',month:'short',year:'numeric'})}
function showVersion(){
  if(REL.state!=='ready'&&REL.state!=='nodmg')return;
  const v=document.getElementById('verline');if(v)v.textContent=' · '+t('最新 {0}，{1}',REL.tag,relDate());
  const f=document.getElementById('footver');if(f)f.textContent=' · '+REL.tag;
}
const sheetOpen=()=>!document.getElementById('dlsheet').hidden;
function closeSheet(){const s=document.getElementById('dlsheet');if(s)s.hidden=true}
function renderSheet(){
  const s=REL.state,sh=document.getElementById('dlsheet');
  const steps=`<ol class="dlsteps"><li>${t('打开下载的 DMG，把 TypeRight 拖进「应用程序」')}</li><li>${t('第一次打开如果提示无法验证开发者：打开「系统设置 › 隐私与安全性」，拉到最下面，点「仍要打开」')}</li><li>${t('跟着引导把图标拖进「辅助功能」列表；之后它待在右上角菜单栏，是一支羽毛笔')}</li></ol>`;
  const file=`<div class="dlfile">${APPICON(36)}<div><b>${s==='ready'?esc(REL.name):'TypeRight'}</b><span>${s==='ready'?`${REL.tag} · ${REL.mb} MB · `:''}${t('Apple 芯片和 Intel 通用')} · ${t('macOS 14 以上')}</span></div></div>`;
  let head,body='',act='';
  if(s==='ready'){head=t('开始下载 TypeRight');body=file+steps;act=`<a class="sbtn sm" href="${REL.url}">${I.dl}${t('没开始？再点一次')}</a><button type="button" class="sbtn sm" data-go="guide">${t('上手指南')}</button>`}
  else if(s==='none'){head=t('第一版还在路上');body=`<p class="dlnote">${t('TypeRight 还没有发布安装包。发布以后，这个按钮会直接下载最新版。')}</p>`;act=`<button type="button" class="sbtn sm" data-go="guide">${t('先看上手指南')}</button><button type="button" class="sbtn sm" data-close>${t('知道了')}</button>`}
  else if(s==='loading'){head=t('正在查最新版本…');body=file}
  else{head=t('去 GitHub 下载');body=file+`<p class="dlnote">${t('在发布页的 Assets 里点 .dmg 安装包。')}</p>`+steps;act=`<a class="sbtn ink sm" href="${REL.page||GH+'/releases/latest'}" target="_blank" rel="noopener">${I.ext}${t('打开发布页')}</a>`}
  sh.innerHTML=`<button type="button" class="x" data-close aria-label="${t('关闭')}">${I.close}</button><h4>${I.apple}${head}</h4>${body}${act?`<div class="act">${act}</div>`:''}`;
  sh.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheet);
}
function download(){
  const sh=document.getElementById('dlsheet');sh.hidden=false;renderSheet();
  if(REL.state==='ready')location.href=REL.url;
}

/* ---------- the popup card, same look as the app's direction A ---------- */
/* the Chinese word the demos type: Traditional on the Traditional Chinese page */
const CNW=LANG==='zh-Hant'?'預約':'预约';
const TIP_BOOK=()=>t('订会议室、餐厅用 book；约医生说 make an appointment。');
const WHY_HAVE=()=>t('主语是 I，动词用 have；has 只跟 he / she / it。');
function cardHTML(p){
  const foot=(acc,right)=>`<div class="pa-foot"><span class="kc">Tab</span>${acc}<span class="kc" style="margin-left:6px">Esc</span>${t('不改')}${right?`<span class="sp">${right}</span>`:''}</div>`;
  if(p.kind==='spell')return `<div class="pa-row"><span class="pa-was">${esc(p.from)}</span><span class="pa-arr">${I.arrow}</span><span class="pa-new">${esc(p.to)}</span></div>${foot(t('改好'),t('拼写 · 在本机查'))}`;
  if(p.kind==='cn')return `<div class="pa-row"><span class="pa-from">${esc(p.from)}${p.py?` <span style="font-size:12px;color:var(--text3)">${t('拼音')}</span>`:''}</span><span class="pa-arr">${I.arrow}</span><span class="pa-new">${esc(p.to)}</span><span class="pa-ipa">${esc(p.ipa||'')}</span><span class="spk" title="${t('听发音')}">${I.spk}</span></div>${p.tip?`<div class="pa-tip">${esc(p.tip)}</div>`:''}${foot(t('换成 {0}',esc(p.to)),t('记进生词本'))}`;
  if(p.kind==='sent')return `<div class="pa-kind">${I.sent}${t('整句')}<span class="r">${t('改了 1 处')}</span></div><div class="pa-sent">${p.html}</div><div class="pa-why">${esc(p.why)}</div>${foot(t('整句换掉'))}`;
  if(p.kind==='ok')return `<div class="pa-row" style="color:var(--fix)">${I.check}<span style="font-size:14px;font-weight:500">${t('这句没问题')}</span></div>`;
}
const PART={spell:'弹框：拼写',cn:'弹框：中文变英文',sent:'弹框：整句',ok:'弹框：整句'};
function staticCard(p,extra=''){return `<div class="pa-card static ${extra}" data-part="${PART[p.kind]}">${cardHTML(p)}</div>`}
/* ---------- a fake app window in which a sentence types itself ---------- */
function winHTML(o={}){
  return `<div class="win ${o.cls||''}" style="${o.style||''}"><div class="tb"><i></i><i></i><i></i><span class="tt">${o.title||t('聊天')}</span><span class="ts">${o.sub||''}</span></div>
   <div class="msgs">${(o.msgs||[]).map(m=>`<div class="bub${m[0]?' me':''}">${esc(m[1])}</div>`).join('')}</div>
   <div class="composer"><div class="field"></div><span style="color:var(--text3)">${I.send}</span></div><div class="keyflash"></div></div>`;
}
let DEMOS=[];
function makeDemo(root,opt={}){
  const field=root.querySelector('.field'),msgs=root.querySelector('.msgs'),kf=root.querySelector('.keyflash');
  let gen=0,segs=[],nid=0,card=null,pill=null;
  const order=opt.scenes||['cn','spell','sent'];
  const sleep=(ms,g)=>new Promise((res,rej)=>setTimeout(()=>g===gen?res():rej('stop'),ms));
  const render=()=>{field.innerHTML=segs.map(s=>`<span data-s="${s.id}" class="${s.c||''}">${esc(s.t)}</span>`).join('')+(opt.noCaret?'':'<span class="caret"></span>')};
  const seg=(x,c)=>{const s={id:++nid,t:x,c};segs.push(s);return s};
  async function type(s,x,g,ms=48){for(const ch of x){s.t+=ch;render();await sleep(ms+Math.random()*44,g)}}
  function rectOf(ids){
    const rr=root.getBoundingClientRect(),k=rr.width/root.offsetWidth||1;let u=null;
    ids.forEach(id=>{const el=field.querySelector(`[data-s="${id}"]`);if(!el)return;for(const r of el.getClientRects()){const o={l:(r.left-rr.left)/k,t:(r.top-rr.top)/k,r:(r.right-rr.left)/k,b:(r.bottom-rr.top)/k};u=u?{l:Math.min(u.l,o.l),t:Math.min(u.t,o.t),r:Math.max(u.r,o.r),b:Math.max(u.b,o.b)}:o}});
    return u;
  }
  function place(el,ids,anchorId){
    const u=rectOf(ids),a=rectOf([anchorId||ids[ids.length-1]])||u;if(!u)return;
    root.appendChild(el);const W=root.offsetWidth,w=el.offsetWidth,h=el.offsetHeight;
    let left=Math.max(8,Math.min(W-w-8,a.l-14));
    el.style.left=left+'px';el.style.top=(u.t-h-10)+'px';el.classList.add('above');
    el.style.setProperty('--nx',Math.max(12,Math.min(w-22,a.l+Math.min(16,(a.r-a.l)/2)-left-5))+'px');
  }
  function clearPop(){card&&card.remove();pill&&pill.remove();card=pill=null}
  function showCard(p,ids,anchor){clearPop();card=document.createElement('div');card.className='pa-card';card.dataset.part=PART[p.kind];card.innerHTML=cardHTML(p);place(card,ids,anchor)}
  function showPill(txt,ids,ok){clearPop();pill=document.createElement('div');pill.className='pa-pill'+(ok?' ok':'');pill.innerHTML=ok?I.check+txt:`<span class="spin"><i></i><i></i><i></i></span>${txt}`;root.appendChild(pill);const u=rectOf(ids);if(!u)return;const W=root.offsetWidth;pill.style.left=Math.max(8,Math.min(W-pill.offsetWidth-8,u.r-pill.offsetWidth))+'px';pill.style.top=(u.t-pill.offsetHeight-8)+'px'}
  async function press(label,g){kf.innerHTML=`<span class="kc">Tab</span>${label}`;kf.classList.add('on');await sleep(700,g);kf.classList.remove('on')}
  const PRE={cn:()=>{},spell:()=>{seg('I want to book')},sent:()=>{seg('I want to book a meeting room tomorrow ')}};
  const STEP={
    async cn(g){const a=seg('');await type(a,'I want to ',g);const w=seg('','m-ime');await type(w,CNW,g,170);await sleep(420,g);w.c='m-src';render();
      showPill(t('想一下…'),[w.id]);await sleep(1150,g);
      showCard({kind:'cn',from:CNW,to:'book',ipa:'/bʊk/',tip:TIP_BOOK()},[w.id]);await sleep(opt.hold||2700,g);
      await press(t('换成 book'),g);clearPop();w.t='book';w.c='m-just';render();setTimeout(()=>{w.c=''},1300);await sleep(500,g)},
    async spell(g){const b=seg('');await type(b,' a meeting room ',g);const w=seg('');await type(w,'tomorow',g);const s=seg('');await type(s,' ',g);w.c='m-src';render();
      showCard({kind:'spell',from:'tomorow',to:'tomorrow'},[w.id]);await sleep(opt.hold||2400,g);
      await press(t('改好'),g);clearPop();w.t='tomorrow';w.c='m-just';render();setTimeout(()=>{w.c=''},1300);await sleep(500,g)},
    async sent(g){const c=seg('');await type(c,'because I has a question.',g);const ids=segs.map(s=>s.id);
      showPill(t('想一下…'),[c.id]);await sleep(1100,g);
      showCard({kind:'sent',html:'I want to book a meeting room tomorrow because I <del class="was">has</del><ins class="now">have</ins> a question.',why:WHY_HAVE()},ids,segs[0].id);await sleep(opt.hold?opt.hold+800:3500,g);
      await press(t('整句换掉'),g);clearPop();segs=[];seg('I want to book a meeting room tomorrow because I have a question.','m-just');render();await sleep(1200,g)}
  };
  async function run(from=0){
    const g=++gen;clearPop();kf.classList.remove('on');segs=[];
    try{
      PRE[order[from]]();render();
      for(let i=from;i<order.length;i++){opt.onScene&&opt.onScene(i);await STEP[order[i]](g)}
      let sent=null;
      if(opt.send){const txt=segs.map(s=>s.t).join('');segs=[];render();sent=document.createElement('div');sent.className='bub me new';sent.textContent=txt;msgs.appendChild(sent)}
      await sleep(opt.send?2200:1600,g);
      if(sent)sent.remove();
      run(0);
    }catch(e){if(e!=='stop')throw e}
  }
  const d={run,stop(){gen++;clearPop();kf.classList.remove('on')},freeze(){gen++},clearPop,field,root};
  DEMOS.push(d);return d;
}

}
/* ---------- the hero: watch it, or type into it yourself ---------- */
const TYPO={tomorow:'tomorrow',recieve:'receive',definately:'definitely',teh:'the',becuase:'because',untill:'until',wich:'which',seperate:'separate',adress:'address',occured:'occurred',beleive:'believe',freind:'friend',wierd:'weird',thier:'their',mesage:'message',meating:'meeting',tommorow:'tomorrow',goverment:'government',enviroment:'environment',accomodate:'accommodate'};
const CN={'预约':['book','/bʊk/',()=>TIP_BOOK()],'会议':['meeting','/ˈmiːtɪŋ/',()=>t('开会说 have a meeting。')],'周末':['weekend','/ˌwiːkˈend/',()=>t('在周末说 on the weekend。')],'发票':['invoice','/ˈɪnvɔɪs/',()=>t('开发票说 issue an invoice。')],'提醒':['remind','/rɪˈmaɪnd/',()=>t('提醒某人做某事：remind sb. to do sth.')],'推迟':['postpone','/poʊstˈpoʊn/',()=>t('口语也常说 push back。')],'截止日期':['deadline','/ˈdedlaɪn/',()=>t('赶截止日期说 meet the deadline。')],'报销':['reimburse','/ˌriːɪmˈbɜːrs/',()=>t('名词是 reimbursement。')]};
/* Traditional spellings of the same words, so the try-it box answers 預約 as well as 预约 */
for(const [h,s] of [['預約','预约'],['會議','会议'],['週末','周末'],['發票','发票'],['推遲','推迟'],['報銷','报销']])CN[h]=CN[s];
const PY={yuyue:'预约',huiyi:'会议',zhoumo:'周末',fapiao:'发票',tixing:'提醒',tuichi:'推迟',baoxiao:'报销'};
const RULES=[
  [/(?<=\bI )has\b/,()=>'have',()=>WHY_HAVE()],
  [/(?<=\b(?:he|she|it) )don't\b/i,()=>"doesn't",()=>t("he / she / it 后面用 doesn't。")],
  [/(?<=\b(?:he|she|it) )(go|do|have|want|need|like|know|work)\b/i,m=>({go:'goes',do:'does',have:'has'}[m[1].toLowerCase()]||m[1]+'s'),()=>t('主语是 he / she / it，动词要加 s。')],
  [/(?<=\bdiscuss) about\b/i,()=>'',()=>t('discuss 后面直接跟要讨论的事，不加 about。')],
  [/\bam (?=agree\b)/i,()=>'',()=>t('agree 本身是动词，不用 am。')],
  [/\bvery(?= like\b)/i,()=>'really',()=>t('very 不能直接修饰动词，说 really like。')],
  [/(?<=\barrive )to\b/i,()=>'in',()=>t('到城市、国家用 arrive in，到某个地点用 arrive at。')],
  [/\bis fail\b/i,()=>'fails',()=>t('fail 本身是动词，不用 is。')],
];
function makeTry(play,demo){
  const field=demo.field,root=play.querySelector('#hdemo'),row=play.querySelector('#tryrow');
  let on=false,card=null,pill=null,pend=null,typed=0,timer=null;
  const txt=()=>field.textContent;
  function hint(){row.innerHTML=on?`<button class="sbtn" id="tback">${I.play}${t('看演示')}</button><span class="hint">${t('试试：<b>tomorow</b> 加空格，打<b>「预约」</b>停一下，<b>yuyue</b> 加空格，<b>I has a question.</b>')}</span>`:`<button class="sbtn ink" id="tgo">${I.kbd}${t('自己打一句试试')}</button><span class="hint">${t('演示在自己播放；点输入框也能接手。')}</span>`;
    const g=row.querySelector('#tgo');if(g)g.onclick=start;const b=row.querySelector('#tback');if(b)b.onclick=stop}
  function start(){if(on)return;on=true;demo.freeze();demo.clearPop();field.contentEditable='true';field.spellcheck=false;field.setAttribute('autocorrect','off');field.setAttribute('autocapitalize','off');field.innerHTML='';play.classList.add('trying');play.querySelectorAll('.moment').forEach(m=>m.classList.remove('on'));hint();field.focus()}
  function stop(){on=false;close();field.contentEditable='false';play.classList.remove('trying');hint();demo.run(0)}
  function rectFor(a,b){
    const rr=root.getBoundingClientRect(),k=rr.width/root.offsetWidth||1;const r=document.createRange();let pos=0,sN,sO,eN,eO;
    const w=document.createTreeWalker(field,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode())){const L=n.length;if(sN==null&&a<=pos+L){sN=n;sO=a-pos}if(eN==null&&b<=pos+L){eN=n;eO=b-pos;break}pos+=L}
    if(!sN||!eN)return null;r.setStart(sN,sO);r.setEnd(eN,eO);const rs=[...r.getClientRects()];if(!rs.length)return null;
    return {l:(rs[0].left-rr.left)/k,t:(Math.min(...rs.map(x=>x.top))-rr.top)/k,r:(rs[0].right-rr.left)/k};
  }
  function close(){card&&card.remove();pill&&pill.remove();card=pill=null;pend=null;typed=0}
  function put(el,a,b){const u=rectFor(a,b);root.appendChild(el);if(!u)return;const W=root.offsetWidth,w=el.offsetWidth,h=el.offsetHeight;const left=Math.max(8,Math.min(W-w-8,u.l-14));el.style.left=left+'px';el.style.top=(u.t-h-10)+'px';el.classList.add('above');el.style.setProperty('--nx',Math.max(12,Math.min(w-22,u.l+12-left))+'px')}
  function showCard(p,a,b,repl){close();card=document.createElement('div');card.className='pa-card';card.dataset.part=PART[p.kind];card.innerHTML=cardHTML(p);put(card,a,b);pend=repl?{a,b,repl}:null}
  function showPill(s,a,b,ok){close();pill=document.createElement('div');pill.className='pa-pill'+(ok?' ok':'');pill.innerHTML=ok?I.check+s:`<span class="spin"><i></i><i></i><i></i></span>${s}`;root.appendChild(pill);const u=rectFor(a,b);if(u){pill.style.left=Math.max(8,u.l)+'px';pill.style.top=(u.t-pill.offsetHeight-8)+'px'}}
  function accept(){const s=txt(),{a,b,repl}=pend;const after=s.slice(b);field.innerHTML=esc(s.slice(0,a))+`<span class="m-just">${esc(repl)}</span>`+esc(after);close();const r=document.createRange();r.selectNodeContents(field);r.collapse(false);const sel=getSelection();sel.removeAllRanges();sel.addRange(r)}
  function checkCN(){const s=txt(),m=s.match(/[一-鿿]+$/);if(!m)return;const a=m.index,b=s.length,hit=CN[m[0]];
    showPill(t('想一下…'),a,b);setTimeout(()=>{if(!on||txt()!==s)return;if(hit)showCard({kind:'cn',from:m[0],to:hit[0],ipa:hit[1],tip:hit[2]()},a,b,hit[0]);else{showCard({kind:'cn',from:m[0],to:'…',tip:t('网页演示只认这几个词：预约、会议、周末、发票、提醒、推迟、截止日期、报销。装好的 TypeRight 用 AI，什么词都行。')},a,b,null)}},1000)}
  function analyse(){
    if(!on)return;const s=txt();clearTimeout(timer);
    if(/[一-鿿]$/.test(s)){timer=setTimeout(checkCN,650);return}
    const end=s.slice(-1);
    if(/[\s,;:.!?]/.test(end)){
      const m=s.slice(0,-1).match(/([A-Za-z']+)$/);
      if(m){const w=m[1],a=s.length-1-w.length,lw=w.toLowerCase();
        if(TYPO[lw]){showCard({kind:'spell',from:w,to:TYPO[lw]},a,a+w.length,TYPO[lw]);return}
        if(PY[lw]){const z=PY[lw],hit=CN[z];showPill(t('想一下…'),a,a+w.length);setTimeout(()=>{if(on&&txt()===s)showCard({kind:'cn',from:w,py:1,to:hit[0],ipa:hit[1],tip:hit[2]()},a,a+w.length,hit[0])},900);return}}
      if(/[.!?]/.test(end)){const st=Math.max(s.slice(0,-1).search(/[^.!?]*$/),0);let a=st;while(s[a]===' ')a++;const sent=s.slice(a);
        showPill(t('想一下…'),a,s.length);
        setTimeout(()=>{if(!on||txt()!==s)return;for(const [re,fix,why] of RULES){const m=sent.match(re);if(m){const to=fix(m);const html=esc(sent.slice(0,m.index))+`<del class="was">${esc(m[0])}</del>${to?`<ins class="now">${esc(to)}</ins>`:''}`+esc(sent.slice(m.index+m[0].length));showCard({kind:'sent',html,why:why()},a,s.length,sent.slice(0,m.index)+to+sent.slice(m.index+m[0].length));return}}
          showPill(t('这句没问题'),a,s.length,true);setTimeout(()=>{if(pill&&pill.classList.contains('ok'))close()},1400)},1000)}
    }
  }
  field.addEventListener('keydown',e=>{if(!on)return;if(card||pill){if(e.key==='Tab'&&pend){e.preventDefault();accept();return}if(e.key==='Escape'){e.preventDefault();close();return}if(e.key==='Tab'){e.preventDefault();return}if(e.key.length===1||e.key==='Backspace'){typed++;if(typed>=2)close()}}else if(e.key==='Tab')e.preventDefault()});
  field.addEventListener('input',e=>{if(e.isComposing)return;analyse()});
  field.addEventListener('compositionend',()=>setTimeout(analyse,0));
  field.addEventListener('mousedown',()=>{if(!on)start()});
  root.addEventListener('mousedown',e=>{if(on&&(card||pill)&&!e.target.closest('.pa-card'))close()});
  hint();
}
function afterHome(root){
  const ms=[...root.querySelectorAll('.moment')];
  const d=makeDemo(root.querySelector('#hdemo'),{send:true,onScene:i=>ms.forEach((m,j)=>m.classList.toggle('on',i===j))});
  makeTry(root.querySelector('#play'),d);
  ms.forEach(m=>m.onclick=()=>{if(root.querySelector('#play').classList.contains('trying'))root.querySelector('#tback').click();d.run(+m.dataset.sc)});
  d.run(0);
  root.querySelectorAll('[data-mini]').forEach((el,i)=>{const md=makeDemo(el,{scenes:[el.dataset.mini],hold:2600});setTimeout(()=>md.run(0),400+i*900)});
  /* numbered pins on the enlarged card, same numbers as the list beside it */
  const big=root.querySelector('.anat .big');
  if(big){const pin=()=>{big.querySelectorAll('.pin').forEach(x=>x.remove());const br=big.getBoundingClientRect();
    const cr=big.querySelector('.pa-card').getBoundingClientRect();
    [['del.was',0],['ins.now',0],['.pa-why',1],['.pa-foot',1]].forEach(([sel,side],i)=>{const el=big.querySelector(sel);if(!el)return;const r=el.getBoundingClientRect();const p=document.createElement('span');p.className='pin';p.textContent=i+1;
      p.style.left=(side?cr.left-br.left-34:r.left-br.left+r.width/2-11)+'px';p.style.top=(side?r.top-br.top+r.height/2-11:cr.top-br.top-34)+'px';big.appendChild(p)})};
    requestAnimationFrame(pin);addEventListener('resize',pin)}
  bindBoard(root);
}

  return `<section class="bhero" data-part="价格页"><div class="wrap">${priceHead(t('软件开源免费，<br>拼写永远免费，AI 按你的方式。'))}${board()}
   <p class="lede" style="margin-top:36px">${t('不知道选哪个？点一个最像你的：')}</p>
   <div class="persona" id="persona" data-part="你更接近哪一种">${[['local',t('只想拼写别错'),t('→ 只用本机检查，免费')],['mem',t('装好就用，不想折腾'),t('→ 会员，每天 500 次')],['key',t('会自己申请 Key'),t('→ 自带 Key，长期免费')]].map(([k,b,s])=>`<button data-p="${k}"><b>${b}</b><span>${s}</span></button>`).join('')}</div>
   <h2 class="h2" style="margin-top:96px;font-size:30px">${t('三种用法，差在哪。')}</h2>${cmpTable()}
   <div class="pnotes"><div><b>${t('TypeRight 是开源软件')}</b>${t('代码全部公开在 GitHub（GPL-3.0）。会员费用于 AI 转发服务器和模型开销。')}</div><div><b>${t('怎么付')}</b>${t('在应用里开会员，由 Stripe 收款：银行卡、Apple Pay；人民币也能用微信一次买 1 个月或 1 年。')}</div><div><b>${t('付完款后')}</b>${t('回到应用几秒内生效。授权码显示在付款完成页和「账号与会员」里，在另一台 Mac 上输入它也能用。')}</div></div></div></section>
  <section class="sec" id="pfaq" data-part="付费问题"><div class="wrap"><h2 class="h2" style="font-size:30px">${t('关于付费的问题')}</h2><div class="faq faq2">${faqHTML(FAQ_PRICE())}</div></div></section>

  root.querySelectorAll('#persona button').forEach(b=>b.onclick=()=>{root.querySelectorAll('#persona button').forEach(x=>x.classList.toggle('on',x===b));root.querySelectorAll('#board .col').forEach(c=>c.classList.toggle('pick',c.dataset.plan===b.dataset.p));root.querySelector('#board').scrollIntoView({behavior:'smooth',block:'center'})});

const TITLES=()=>({home:t('TypeRight · 打英文时，在旁边帮你改'),pricing:t('价格')+' · TypeRight',guide:t('上手指南')+' · TypeRight',privacy:t('隐私政策')+' · TypeRight',refund:t('退款政策')+' · TypeRight',terms:t('服务条款')+' · TypeRight'});
