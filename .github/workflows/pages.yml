# TypeRight 官网：website/ 有改动推到 main 就发到 GitHub Pages（typeright.us-cloud.uk 由服务器转过来，照 MeetCaption、Ask Free、GetNewWord）
# 第一次之前要在仓库里打开 Pages、来源选 GitHub Actions（docs/RELEASE.md 第 7 步）。
name: pages
on:
  push:
    branches: [main]
    paths: [website/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
